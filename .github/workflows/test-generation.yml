name: Test Generation

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 06:00 UTC
    - cron: '0 6 * * 1-5'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
      DIDAXIS_NONADMIN_EMAIL: ${{ secrets.DIDAXIS_NONADMIN_EMAIL }}
      DIDAXIS_NONADMIN_PASSWORD: ${{ secrets.DIDAXIS_NONADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Work In Progress backlog
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          GH_PAT_AI_2: ${{ secrets.GH_PAT_AI_2 }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          Work the "In Progress" backlog for DS tickets that do not already have the tests-generated label.
          For each ticket: analyze it, write a conforming Playwright spec under tests/, run the tests, open a PR linked to the ticket, and add the tests-generated label.
          Budget: at most 5 tickets per run.
          Never merge or close without a human.
          EOF
          )"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
