# One-shot helper: encrypts Atlassian secrets for a caller that already knows
# the passphrase (passed as a workflow_dispatch input). Used to unblock
# headless agents when ATLASSIAN_EMAIL was not injected into the job env.
# Do not echo secret values.
name: Jira Creds Bootstrap

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: Opaque passphrase used to encrypt the credential blob
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt Atlassian credentials
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_BASE_URL: ${{ secrets.ATLASSIAN_BASE_URL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          PASSPHRASE: ${{ inputs.passphrase }}
        run: |
          set -euo pipefail
          if [ -z "${ATLASSIAN_EMAIL}" ] || [ -z "${ATLASSIAN_BASE_URL}" ] || [ -z "${ATLASSIAN_API_TOKEN}" ] || [ -z "${PASSPHRASE}" ]; then
            echo "Missing required Atlassian secrets or passphrase" >&2
            exit 1
          fi
          python3 - <<'PY' > creds.json
          import json, os
          print(json.dumps({
            "ATLASSIAN_EMAIL": os.environ["ATLASSIAN_EMAIL"],
            "ATLASSIAN_BASE_URL": os.environ["ATLASSIAN_BASE_URL"],
            "ATLASSIAN_API_TOKEN": os.environ["ATLASSIAN_API_TOKEN"],
          }))
          PY
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PASSPHRASE -in creds.json -out creds.enc
          rm -f creds.json
          echo "Encrypted credential blob ready"

      - uses: actions/upload-artifact@v4
        with:
          name: atlassian-creds
          path: creds.enc
          retention-days: 1
